<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<h1 class="title">
Nesse Site Você Encontrará Alguém Para a Prestação de Serviço Mais Adequada
</h1>

<h2>Selecione o botão desejado:</h2>

<div class="principal">
    <button class="desejado" onclick="mostrar(this)">Quero Contratar Serviço</button>
    <button class="desejado" onclick="mostrar(this)">Quero Prestar Serviço</button>
</div>

<div id="conteudo" class="escondido">

    <button class="servico" onclick="selecionarServico(this)">Cuidador de Idoso</button>
    <button class="servico" onclick="selecionarServico(this)">Pintor</button>
    <button class="servico" onclick="selecionarServico(this)">Marceneiro</button>
    <button class="servico" onclick="selecionarServico(this)">Encanador</button>
    <button class="servico" onclick="selecionarServico(this)">Eletricista</button>

    <br><br>

    <div id="formulario" class="escondido">
        <form>

            <label>Nome:</label><br>
            <input type="text" name="nome" required><br><br>

            <label>Email:</label><br>
            <input type="email" name="email" required><br><br>

            <label>Idade:</label><br>
            <input type="number" name="idade" min="18" required><br><br>

            <label>Cidade:</label><br>
            <input type="text" name="cidade" required><br><br>

            <label>Estado:</label><br>
            <input type="text" name="estado" required><br><br>

            <button type="submit">Salvar</button>

        </form>
    </div>

</div>

<p class="opiniao">
Inserir abaixo sugestões de melhora e/ou elogios:
</p>

<label>Opiniões</label>
<input type="text" name="opiniao"><br><br>

<img src="./img/img.png" class="imagem-lateral">

<script src="script.js"></script>

</body>
</html>
